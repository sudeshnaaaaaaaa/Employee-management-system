<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ledger — Employee Management{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="frame">
        <aside class="rail">
            <div class="rail-mark">Ledger</div>
            <nav class="rail-nav">
                <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Overview</a>
                <a href="{{ url_for('list_employees') }}" class="{{ 'active' if request.endpoint in ['list_employees','add_employee','edit_employee'] }}">People</a>
                <a href="{{ url_for('list_projects') }}" class="{{ 'active' if request.endpoint == 'list_projects' }}">Projects</a>
                <a href="{{ url_for('list_departments') }}" class="{{ 'active' if request.endpoint == 'list_departments' }}">Departments</a>
            </nav>
        </aside>

        <main class="content">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-stack">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
