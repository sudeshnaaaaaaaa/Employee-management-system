{% extends "base.html" %}
{% block title %}{{ 'Edit' if employee else 'Add' }} employee — Ledger{% endblock %}
{% block content %}

<header class="page-head">
    <h1>{{ 'Edit employee' if employee else 'Add employee' }}</h1>
</header>

<section class="panel panel-narrow">
    <form method="post" class="stack-form">
        <label>
            First name
            <input type="text" name="first_name" required
                   value="{{ employee['first_name'] if employee else '' }}">
        </label>
        <label>
            Last name
            <input type="text" name="last_name" required
                   value="{{ employee['last_name'] if employee else '' }}">
        </label>
        <label>
            Email
            <input type="email" name="email" required
                   value="{{ employee['email'] if employee else '' }}">
        </label>
        <label>
            Role
            <input type="text" name="role" required
                   value="{{ employee['role'] if employee else '' }}">
        </label>
        <label>
            Annual salary (₹)
            <input type="number" step="1000" name="salary" required
                   value="{{ employee['salary'] if employee else '' }}">
        </label>
        <label>
            Department
            <select name="department_id">
                <option value="">— None —</option>
                {% for d in departments %}
                <option value="{{ d['id'] }}"
                    {% if employee and employee['department_id'] == d['id'] %}selected{% endif %}>
                    {{ d['name'] }}
                </option>
                {% endfor %}
            </select>
        </label>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ 'Save changes' if employee else 'Add employee' }}</button>
            <a href="{{ url_for('list_employees') }}" class="btn btn-quiet">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
